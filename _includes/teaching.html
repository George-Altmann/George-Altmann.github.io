<div class="news">
  {% if site.teaching != blank %}
    <table>
      {% assign teaching = site.teaching | sort: "year" | reverse %}
      {% for item in teaching %}
        <tr>
          <th style="width: 20%">{{ item.year }}</th>
          <td>
            <strong>{{ item.title }}</strong>, {{ item.institution }}
          </td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No teaching items so far...</p>
  {% endif %}
</div>
